org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true

# Manifest resolution mode of the extraction commands: 'repository' reads the committed in-repo manifest, 'checkout'
# reads supportingFiles/feature-model/artemis-feature-manifest.yml inside the Artemis checkout. The committed default
# stays 'repository' until the cutover flips it.
featureManifestSource=repository
