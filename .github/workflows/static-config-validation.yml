name: Static config validation

# CI gate: statically validate the generated configuration overlay against the
# Artemis config key catalog without booting Artemis. Scoped to the working branch
# and manual dispatch on purpose; the general CI workflow covers other branches.
on:
  push:
    branches:
      - feature/deployment-package-static-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static key and type validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run static config validation gate
        run: >-
          ./gradlew test
          --tests 'de.tum.cit.aet.artemis.featuremodel.export.service.StaticConfigValidationServiceTest'
          --tests 'de.tum.cit.aet.artemis.featuremodel.export.service.DeploymentPackageServiceTest'

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-config-validation-report
          path: build/reports/static-config-validation/static-config-validation.json
          if-no-files-found: warn
