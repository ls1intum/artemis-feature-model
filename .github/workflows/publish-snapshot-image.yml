name: Publish snapshot image

on:
  push:
    branches:
      - deployment/image-publish-test

permissions:
  contents: read

concurrency:
  group: image-publish-test
  cancel-in-progress: false

jobs:
  validate:
    name: Revalidate publication commit
    uses: ./.github/workflows/model-delivery-validation.yml
    permissions:
      contents: read

  publish:
    name: Publish public GHCR image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/deployment/image-publish-test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: image-publish-test
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download smoke-tested image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.validate.outputs.image_artifact_name }}
          path: build/published-image

      - name: Load and verify publication input
        shell: bash
        run: |
          set -euo pipefail
          docker load --input build/published-image/snapshot-image.tar
          test "$(docker image inspect artemis-feature-model:ci-${GITHUB_SHA} --format '{{.Architecture}}')" = "amd64"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish discovery tag and capture registry digest
        id: publish
        shell: bash
        env:
          REGISTRY_IMAGE: ghcr.io/ls1intum/artemis-feature-model
        run: |
          set -euo pipefail
          discovery_tag="test-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          target_image="${REGISTRY_IMAGE}:${discovery_tag}"
          docker tag "artemis-feature-model:ci-${GITHUB_SHA}" "$target_image"
          push_output=$(mktemp)
          docker push "$target_image" | tee "$push_output"
          image_digest=$(awk '$2 == "digest:" { print $3 }' "$push_output" | tail -n 1)
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "discovery_tag=$discovery_tag" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Prove anonymous digest pull and provenance
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.image_digest }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          immutable_image="ghcr.io/ls1intum/artemis-feature-model@${IMAGE_DIGEST}"
          docker pull --platform linux/amd64 "$immutable_image"
          test "$(docker image inspect "$immutable_image" --format '{{.Architecture}}')" = "amd64"
          scripts/verify-snapshot-image.sh "$immutable_image" build/published-image/feature-model-snapshot

      - name: Record publication evidence
        shell: bash
        env:
          ARTEMIS_COMMIT: ${{ needs.validate.outputs.artemis_commit }}
          DISCOVERY_TAG: ${{ steps.publish.outputs.discovery_tag }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.image_digest }}
          MANIFEST_DIGEST: ${{ needs.validate.outputs.manifest_digest }}
          SNAPSHOT_DIGEST: ${{ needs.validate.outputs.snapshot_digest }}
          SNAPSHOT_ID: ${{ needs.validate.outputs.snapshot_id }}
        run: |
          set -euo pipefail
          jq -n \
            --arg registryImage "ghcr.io/ls1intum/artemis-feature-model" \
            --arg discoveryTag "$DISCOVERY_TAG" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg featureModelRepositoryCommit "$GITHUB_SHA" \
            --arg artemisCommit "$ARTEMIS_COMMIT" \
            --arg manifestDigest "$MANIFEST_DIGEST" \
            --arg snapshotId "$SNAPSHOT_ID" \
            --arg snapshotDigest "$SNAPSHOT_DIGEST" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schemaVersion: 1,
              registryImage: $registryImage,
              discoveryTag: $discoveryTag,
              imageDigest: $imageDigest,
              platform: "linux/amd64",
              featureModelRepositoryCommit: $featureModelRepositoryCommit,
              artemisCommit: $artemisCommit,
              manifestDigest: $manifestDigest,
              snapshotId: $snapshotId,
              snapshotDigest: $snapshotDigest,
              anonymousDigestPull: true,
              provenanceSmoke: "pass",
              latestTagPublished: false,
              workflow: {runId: ($runId | tonumber), runAttempt: ($runAttempt | tonumber)}
            }' > build/published-image/publication-evidence.json

      - name: Upload publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: build/published-image/publication-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize publication
        shell: bash
        run: |
          {
            echo '## Public snapshot image publication'
            echo
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`ghcr.io/ls1intum/artemis-feature-model@${{ steps.publish.outputs.image_digest }}\`"
            echo "- Discovery tag: \`${{ steps.publish.outputs.discovery_tag }}\`"
            echo '- Platform: `linux/amd64`'
            echo "- Snapshot: \`${{ needs.validate.outputs.snapshot_id }}\` (\`${{ needs.validate.outputs.snapshot_digest }}\`)"
            echo "- Artemis commit: \`${{ needs.validate.outputs.artemis_commit }}\`"
            echo "- Manifest digest: \`${{ needs.validate.outputs.manifest_digest }}\`"
            echo '- Anonymous digest pull and container provenance smoke: `pass`'
            echo "- Evidence artifact: \`publication-evidence-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}\`"
            echo
            echo '`LAST_VERIFIED_IMAGE_DIGEST` was not changed. Deployment and rollback remain deferred.'
          } >> "$GITHUB_STEP_SUMMARY"
