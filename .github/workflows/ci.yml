name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-validation:
    name: Application validation
    uses: ./.github/workflows/application-validation.yml
    permissions:
      contents: read

  model-delivery-gates:
    name: Model delivery gates
    uses: ./.github/workflows/model-delivery-validation.yml
    permissions:
      contents: read
