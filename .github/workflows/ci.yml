name: CI

# A change that only touches documentation/ skips this workflow; build-documentation.yml checks it instead. A skipped
# workflow leaves its checks pending, so if these checks ever become required on mvp, docs-only pull requests cannot merge.
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'documentation/**'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - 'documentation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-validation:
    name: Application validation
    uses: ./.github/workflows/application-validation.yml
    permissions:
      contents: read

  model-delivery-gates:
    name: Model delivery gates
    uses: ./.github/workflows/model-delivery-validation.yml
    permissions:
      contents: read
