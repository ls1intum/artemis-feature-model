name: Build documentation

# Builds the documentation site as a check on pull requests that change it; the build fails on type errors and on
# broken links or anchors. deploy-documentation.yml reuses this workflow and asks it to upload the Pages artifact.
on:
  pull_request:
    paths:
      - 'documentation/**'
      - '.github/workflows/build-documentation.yml'
      - '.github/workflows/deploy-documentation.yml'
  workflow_call:
    inputs:
      upload_pages_artifact:
        description: Also upload the built site as the GitHub Pages artifact for the deploy job
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: documentation

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: documentation/package-lock.json

      - name: Install documentation dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build documentation site
        run: npm run build

      # Uploading needs no extra permission; `pages: write` lives on the deploy job.
      - name: Upload Pages artifact
        if: ${{ inputs.upload_pages_artifact }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: documentation/build
