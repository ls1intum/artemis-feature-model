plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'de.tum.cit.aet.artemis'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('syncFeatureModelResource', Copy) {
    description = 'Copies the WP1 feature-model artifact into the runtime classpath resource location.'
    group = 'build setup'
    from "$projectDir/devdocs/mvp/common/functional-feature-model.json"
    into "$projectDir/src/main/resources/feature-model"
}
