---
# Secret values are never stored in this package; every value below is resolved from a
# control-node environment variable at run time. See README.md for providing the values.
artemis_database_password: "{{ lookup('ansible.builtin.env', 'ARTEMIS_DATABASE_PASSWORD') }}"
artemis_internal_admin_password: "{{ lookup('ansible.builtin.env', 'ARTEMIS_INTERNAL_ADMIN_PASSWORD') }}"
artemis_jhipster_jwt: "{{ lookup('ansible.builtin.env', 'ARTEMIS_JHIPSTER_JWT') }}"