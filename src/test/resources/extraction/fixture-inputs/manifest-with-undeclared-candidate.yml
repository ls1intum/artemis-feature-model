# Copy of the mini-Artemis manifest with the module:gamma exclusion removed, so one discovered candidate has no
# decision and the conformance gate must stop the run.
manifestVersion: 2
artemisCommitSha: aaaaaaaabbbbbbbbccccccccddddddddeeeeeeee
artemisImageDigest: latest
include:
  - anchor: module:alpha
    id: alpha-feature
    group: fixture-root
exclude:
  - { anchor: configkey:artemis.alpha.enabled, reason: internal-mechanism }
  - { anchor: configkey:artemis.alpha.gamma.enabled, reason: internal-mechanism }
  - { anchor: configkey:artemis.user-management.beta.enabled, reason: internal-mechanism }
  - { anchor: infra:mysql, reason: test-fixture }
  - { anchor: infra:postgres, reason: test-fixture }
  - { anchor: module:beta, reason: test-fixture }
  - { anchor: module:beta-extra, reason: test-fixture }
  - { anchor: module:delta, reason: test-fixture }
  - { anchor: profile:agentx, reason: test-fixture }
  - { anchor: profile:cione, reason: test-fixture }
  - { anchor: profile:feprofile, reason: test-fixture }
  - { anchor: profile:jenkins, reason: test-fixture }
  - anchor: toggle:ClientOnlyToggle
    reason: test-fixture
    rationale: Deliberate client-only fixture toggle.
  - anchor: toggle:ServerOnlyToggle
    reason: test-fixture
    rationale: Deliberate server-only fixture toggle.
  - anchor: toggle:ToggleOne
    reason: test-fixture
    rationale: Fixture toggle excluded for membership testing.
  - anchor: toggle:ToggleTwo
    reason: test-fixture
    rationale: Fixture toggle excluded for membership testing.
conceptualNodes:
  - id: fixture-root
    kind: root
