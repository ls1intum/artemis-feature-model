<li class="tree-node" [attr.data-feature-id]="featureId()" [attr.data-depth]="depth()">
    <div
        class="tree-row"
        [class.tree-row--selected]="isSelected()"
        [class.tree-row--match]="isMatched()"
        role="button"
        tabindex="0"
        [attr.aria-expanded]="hasChildren() ? isExpanded() : null"
        [attr.aria-selected]="isSelected()"
        (click)="onSelect()"
        (keydown.enter)="onSelect()"
        (keydown.space)="onSelect()"
    >
        @if (hasChildren()) {
            <button
                type="button"
                class="tree-toggle btn btn-sm btn-link p-0"
                [attr.aria-label]="isExpanded() ? 'Collapse ' + node().feature.name : 'Expand ' + node().feature.name"
                (click)="onToggle($event)"
            >
                {{ isExpanded() ? '▾' : '▸' }}
            </button>
        } @else {
            <span class="tree-indent" aria-hidden="true"></span>
        }

        <span class="tree-dot {{ kindDotClass() }}" [class.tree-dot--hollow]="isStructural()" role="img" [attr.aria-label]="kindTitle()" [title]="kindTitle()"></span>

        <span class="tree-name" [class.tree-name--structural]="isStructural()" [class.fw-semibold]="isMatched()">{{ node().feature.name }}</span>
        <small class="tree-id text-body-secondary d-none d-md-inline">{{ featureId() }}</small>

        @if (isDefaultEnabled()) {
            <span class="tree-flag" title="Enabled by default">ON</span>
        }
    </div>

    @if (hasChildren() && isExpanded()) {
        <ul class="tree-children">
            @for (child of node().children; track child.feature.id) {
                <fm-feature-model-tree-node
                    [node]="child"
                    [expandedIds]="expandedIds()"
                    [matchedIds]="matchedIds()"
                    [selectedId]="selectedId()"
                    [depth]="nextDepth()"
                    (toggleExpand)="onChildToggle($event)"
                    (selectFeature)="onChildSelect($event)"
                />
            }
        </ul>
    }
</li>
