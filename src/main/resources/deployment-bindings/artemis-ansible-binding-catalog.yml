      apollon_url: https://apollon.aet.cit.tum.de
  sharing:
    binding: "bound"
    membership: "artemistests_sharing"
    evidence: "Guard in artemis.env.j2: sharing is defined, fields url, apikey, and actionname; value shape from the commented reference block in the upstream artemistests_common_config.yml, with the action name pointed at this target's hostname."
