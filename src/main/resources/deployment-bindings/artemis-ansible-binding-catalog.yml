catalogVersion: 4
collectionPin: "13e50a20fea641a5a792e42541952a37cd7f1239"
curationSource: "2026-09-10 re-curation at upstream/main dfdc9fb: MySQL removal #245, valkey rename #246, rate-limit fixes #249, per-job build-agent auth #242; artemis-feature-model-deploy-lab evidence/transformation-table.md, 2026-08-14 baseline including the 2026-08-15 post-baseline deltas; value shapes verified against the lab inventory at commit 2d0385ff (with its 2026-08-15 working-tree deltas) and ls1intum/artemis-ansible at 52d44e162ea4753c97ea89c7b0f7d5ec28d81645; build-agent credential removal per evidence/incident-2026-08-26-build-agent-credentials-refused.md, lab inventory commit 2040df8; artemis_modules off-switches validated per evidence/collection-fork-validation-2026-08-25.md on the JTNing/artemis-ansible-collection branch feature-model/module-toggles; environment-variable names taken verbatim from the user-provisioned mapping of 2026-08-29 (devdocs/plan/deployment/ansible-remote/gitops/ansible-package-github-secrets-mapping.txt)"
files:
  targetMain:
    content: |-
      ---
      #: Host identity; supplied by the execution environment so the package bakes no environment value.
      var_testserver_name: "{{ lookup('ansible.builtin.env', 'TESTSERVER_NAME') }}"
      #: Single maintenance point for the server hostname (server URL and LocalVC ssh_url derive from it lazily, so the env lookup propagates).
      var_server_hostname: "{{ lookup('ansible.builtin.env', 'SERVER_HOSTNAME') }}"
  targetSecrets:
    content: |-
      ---
      # Secret values are never stored in this package; every value below is resolved from a
      # control-node environment variable at run time. See README.md for providing the values.
      #: Deployment-internal contract value; both ends are owned by the deployment. Must stay stable across deploys of a target: a database applies credentials only on first initialization.
      artemis_database_password: "{{ lookup('ansible.builtin.env', 'ARTEMIS_DATABASE_PASSWORD') }}"
      #: Deployment-internal contract value; doubles as the artemis_admin login password.
      artemis_internal_admin_password: "{{ lookup('ansible.builtin.env', 'ARTEMIS_INTERNAL_ADMIN_PASSWORD') }}"
      #: Deployment-internal contract value; format constraint: long base64 value.
      artemis_jhipster_jwt: "{{ lookup('ansible.builtin.env', 'ARTEMIS_JHIPSTER_JWT') }}"
  commonConfig:
    content: |-
      ---
      #: Node 1 carries the scheduling Spring profile.
      node_id: 1
      is_testserver: true
      #: Derivation pattern kept from the upstream inventory; the hostname source is the target values file.
      artemis_server_url: "https://{{ var_server_hostname }}"
      #: Admin-owned contact address; the collection's mail-from split evaluates the lookup lazily.
      artemis_email: "{{ lookup('ansible.builtin.env', 'ARTEMIS_EMAIL_TEST') }}"

      #: Deploy-time image tag baseline.
      artemis_version: develop
      #: Compose-file source branch for the checkout.
      artemis_branch: develop

      artemis_internal_admin_user: artemis_admin
      artemis_passkey_enabled: true
      artemis_repo_basepath: "/opt/artemis/data"
      artemis_tmp_directory: "/tmp"

      #: LocalVC key-generation contract; the quartet is kept verbatim.
      artemis_ssh_key_password:
      artemis_ssh_key_path:
      artemis_ssh_key_name: "id_ecdsa"
      artemis_ssh_priv_key_value: ""

      #: Selects the Docker deployment path of the collection.
      use_docker: true

      #: INFO_OPERATORNAME is unguarded in artemis.env.j2 and therefore mandatory.
      artemis_operator_name: "{{ lookup('ansible.builtin.env', 'ARTEMIS_OPERATOR_NAME') }}"
      #: INFO_OPERATORADMINNAME is unguarded in artemis.env.j2 and therefore mandatory.
      artemis_operator_admin_name: "{{ lookup('ansible.builtin.env', 'ARTEMIS_OPERATOR_ADMIN_NAME') }}"

      artemis_global_search_enabled: true

      artemis_rate_limit:
        account_management_rpm: 5
        authentication_rpm: 30

      #: The collection default is true; a generated deployment must not report to the upstream telemetry endpoint.
      artemis_telemetry_enabled: false

      #: The deployment-automation user is provisioned by the execution environment, not by this package.
      artemis_create_deployment_user: false

      #: nginx bind-mounts the certificate file; the path is admin-owned.
      proxy_ssl_certificate_path: "{{ lookup('ansible.builtin.env', 'PROXY_SSL_CERTIFICATE_PATH') }}"
      #: nginx bind-mounts the key file; the path is admin-owned.
      proxy_ssl_certificate_key_path: "{{ lookup('ansible.builtin.env', 'PROXY_SSL_CERTIFICATE_KEY_PATH') }}"

      #: The collection defaults this variable to the hermes-prod relay; removing the key resurrects the default, so an explicit null is the only off-switch.
      push_notification_relay:
technical:
  database:
    mysql:
      binding: "unsupported"
      reason: "Upstream removed MySQL support at pinned commit 13e50a2: PostgreSQL-hardcoded JDBC URL and compose selection; no collection variable expresses a MySQL deployment."
    postgresql:
      binding: "bound"
      membership: "artemistests_postgres"
      content: |-
        ---
        artemis_database_dbname: "Artemis"
        artemis_database_host: "artemis-postgres"
        artemis_database_username: "Artemis"
        artemis_database_type: postgresql
        artemis_database_port: 5432
  ciProvider:
    integrated-code-lifecycle:
      binding: "bound"
      membership: "artemistests_local_vc_ci"
      evidence: "Single node is core and build agent; a local-CI node must not configure the shared build_agent_git_credentials pair (LocalVCBuildAgentCredentialsValidator refuses startup since Artemis develop 2026-08-25), build agents authenticate per job via SSH keys or clone tokens, with build_agent_use_ssh selecting the SSH path."
      content: |-
        ---
        version_control:
          localvc:
            url: "{{ artemis_server_url }}"
            ssh_key_path: /opt/artemis/data/artemis/ssh-keys
            use_version_control_access_token: true
            build_agent_use_ssh: true
            ssh_url: "ssh://git@{{ var_server_hostname }}:7921/"

        artemis_ssh_key_path: "/tmp"

        continuous_integration:
          localci:
            url: "{{ artemis_server_url }}"
            is_core_node: true
            is_build_agent: true
    jenkins:
      binding: "unsupported"
      reason: "The single-node remote-ansible package provides no Jenkins service; the upstream Jenkins inventory targets the multinode test-server topology, which this package does not support."
