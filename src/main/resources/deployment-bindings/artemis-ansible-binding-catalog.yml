        url: "{{ lookup('ansible.builtin.env', 'IRIS_URL') }}"
        secret: "{{ lookup('ansible.builtin.env', 'IRIS_SECRET') }}"
  athena:
    binding: "bound"
    membership: "artemistests_athena"
    evidence: "Guard in artemis.env.j2: athena is defined, fields url and secret; no upstream inventory example exists, so the value shape follows the iris block convention."
    content: |-
      ---
      athena:
        url: "{{ lookup('ansible.builtin.env', 'ATHENA_URL') }}"
        secret: "{{ lookup('ansible.builtin.env', 'ATHENA_SECRET') }}"
  atlas:
    binding: "bound"
    gating: "deselected"
    membership: "artemistests_without_atlas"
    evidence: "artemis.atlas.enabled defaults to true in the image-shipped application-core.yml, so an absent atlas variable leaves the module enabled and the explicit false is the only off-switch (guard in artemis.env.j2: atlas is defined). A selected atlas needs no values because the image default already enables it. The nested atlasml block is deliberately not emitted; its image default is disabled."
    content: |-
      ---
      atlas:
        enabled: false
  hyperion:
    binding: "bound"
    membership: "artemistests_hyperion"
    evidence: "Guard in artemis.env.j2 renders the Spring AI block only when api_key, endpoint, and deployment_name are all non-empty; an unset variable would fail that guard silently, which is why the preflight env gate refuses missing or empty values first. Value shape from the upstream artemistests_hyperion.yml without the LLM cost overrides."
    content: |-
      ---
      artemis_hyperion_enabled: true

      spring_ai:
        azure_openai:
          api_key: "{{ lookup('ansible.builtin.env', 'AZURE_OPENAI_API_KEY') }}"
          endpoint: "{{ lookup('ansible.builtin.env', 'AZURE_OPENAI_ENDPOINT') }}"
          deployment_name: "{{ lookup('ansible.builtin.env', 'AZURE_OPENAI_DEPLOYMENT_NAME') }}"
          temperature: 1.0
  deimos:
    binding: "bound"
    membership: "artemistests_deimos"
    evidence: "Guard in artemis.env.j2: deimos is defined renders ARTEMIS_DEIMOS_ENABLED='true' plus the five llm values; artemis.deimos.enabled defaults to false in the image-shipped application-core.yml, so absence is off. Value shape from the deimos block of the upstream artemistests_common_config.yml (ls1intum/artemis-ansible at cca6f51), with the api key as a vault lookup following the kv/data/artemis/common/<service> convention. The LLM endpoint is an external service the admin should review."
    content: |-
      ---
      deimos:
        llm:
          base_url: https://logos.aet.cit.tum.de/v1
          api_key: "{{ lookup('hashi_vault', 'kv/data/artemis/common/deimos').get('api_key') }}"
          model: openai/gpt-oss-120b
          completions_path: /chat/completions
          temperature: 0.3
  lti:
    binding: "bound"
    membership: "artemistests_lti"
    evidence: "Guard in artemis.env.j2: lti is defined; value shape from the admin sample (dropped there as a minimal-variant block)."
    content: |-
      ---
      lti:
        oauth_secret: "{{ lookup('ansible.builtin.env', 'LTI_OAUTH_SECRET') }}"
  theia:
    binding: "bound"
    membership: "artemistests_theia"
    evidence: "Guard in artemis.env.j2: core node and theia is defined; value shape from the upstream artemistests_theia.yml. The portal URL is an external service endpoint the admin should review."
    content: |-
      ---
      theia:
