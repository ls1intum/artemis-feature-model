manifestVersion: 1
verifiedAgainstArtemisCommit: 553aab75955a3eec0a66dc1eb54edb4a63233da4

include:
  # Functional module anchors already represented in the curated model.
  - anchor: module:lecture
    id: lecture
    group: teaching-and-content
  - anchor: module:tutorialgroup
    id: tutorialgroup
    group: teaching-and-content
  - anchor: module:text
    id: text
    group: exercise-system
  - anchor: module:modeling
    id: modeling
    group: exercise-system
  - anchor: module:fileupload
    id: file-upload
    group: exercise-system
  - anchor: module:exam
    id: exam
    group: assessment-and-integrity
  - anchor: module:plagiarism
    id: plagiarism
    group: assessment-and-integrity
  - anchor: module:athena
    id: athena
    group: assessment-and-integrity
    requiresCapabilities: [athena-service, athena-secret]
  - anchor: module:atlas
    id: atlas
    group: adaptive-learning-and-ai
  - anchor: module:iris
    id: iris
    group: adaptive-learning-and-ai
    requiresCapabilities: [pyris-service, pyris-secret]
  - anchor: module:hyperion
    id: hyperion
    group: adaptive-learning-and-ai
    requiresCapabilities: [hyperion-service]
  - anchor: module:lti
    id: lti
    group: platform-integrations
    requiresCapabilities: [lti-platform-registration]
  - anchor: module:theia
    id: theia
    group: platform-integrations
    requiresCapabilities: [theia-service]
  - anchor: module:apollon
    id: apollon
    group: platform-integrations
    requiresCapabilities: [apollon-conversion-service]
  - anchor: module:sharing
    id: sharing
    group: platform-integrations
    requiresCapabilities: [sharing-platform-registration, sharing-secret]

  # Newly extracted source-level capabilities retained for generated-model review in E3.
  - anchor: module:atlasml
    id: atlasml
    parent: atlas
    rationale: AtlasML has its own enablement property and Spring condition and is more than a runtime-only switch.
  - anchor: module:ldap
    id: ldap
    group: platform-integrations
    rationale: LDAP authentication and synchronization is a selectable deployment capability with a dedicated condition.
  - anchor: module:saml2
    id: saml2
    group: platform-integrations
    rationale: SAML2 authentication is a selectable deployment integration with a dedicated condition.
  - anchor: module:passkey
    id: passkey
    group: platform-integrations
    rationale: Passkey authentication is independently enabled and user-visible; its administrator policy stays excluded.
  - anchor: module:tumlive
    id: tumlive
    group: platform-integrations
    rationale: TUM Live is an externally configured lecture integration guarded by its own condition.

  # Course-facing runtime toggles are child features of their owning functional capability.
  - anchor: toggle:AtlasAgent
    id: atlas-agent
    parent: atlas
    kind: runtime-toggle
    rationale: The Atlas assistant is a user-visible optional capability within adaptive learning.
  - anchor: toggle:AutonomousTutor
    id: autonomous-tutor
    parent: iris
    kind: runtime-toggle
    rationale: Autonomous course-channel responses are a distinct user-visible Iris behavior.
  - anchor: toggle:Exports
    id: data-exports
    parent: course-workflow
    kind: runtime-toggle
    rationale: Course and exam exports are an instructor-facing capability rather than an operational safeguard.
  - anchor: toggle:GlobalSearch
    id: global-search
    parent: course-workflow
    kind: runtime-toggle
    rationale: Global search is a user-visible navigation capability that can be independently enabled.
  - anchor: toggle:LearningPaths
    id: learning-paths
    parent: atlas
    kind: runtime-toggle
    rationale: Personalized learning paths are a distinct Atlas capability visible to students.
  - anchor: toggle:LectureContentProcessing
    id: lecture-content-processing
    parent: lecture
    kind: runtime-toggle
    rationale: Lecture transcription and ingestion is a separately controlled lecture capability.
  - anchor: toggle:Memiris
    id: memiris
    parent: iris
    kind: runtime-toggle
    rationale: Long-term assistant memory materially changes the Iris user experience and data behavior.
  - anchor: toggle:PlagiarismChecks
    id: plagiarism-checks
    parent: plagiarism
    kind: runtime-toggle
    rationale: The runtime switch controls whether instructors can run the included plagiarism capability.
  - anchor: toggle:ProgrammingExercises
    id: programming-exercises-toggle
    parent: programming
    kind: runtime-toggle
    rationale: The switch gates instructor creation and student participation in programming exercises.
  - anchor: toggle:StandardizedCompetencies
    id: standardized-competencies
    parent: atlas
    kind: runtime-toggle
    rationale: Standards-based competency import is a distinct instructor-facing Atlas capability.
  - anchor: toggle:StudentCourseAnalyticsDashboard
    id: student-course-analytics-dashboard
    parent: atlas
    kind: runtime-toggle
    rationale: The personal analytics dashboard is an independently visible student capability.
  - anchor: toggle:TutorSuggestions
    id: tutor-suggestions
    parent: iris
    kind: runtime-toggle
    rationale: AI-assisted answer suggestions are a distinct tutor-facing Iris capability.

  # Initial technical variability for the unified model.
  - anchor: infra:mysql
    id: mysql
    group: database
    kind: technical
    providesCapabilities: [default-database]
    name: MySQL
  - anchor: infra:postgres
    id: postgresql
    group: database
    kind: technical
    providesCapabilities: [default-database]
    name: PostgreSQL
  - anchor: profile:localci
    id: integrated-code-lifecycle
    group: ci-provider
    kind: technical
    providesCapabilities: [default-ci-provider]
    name: Integrated Code Lifecycle
    rationale: Local CI is the canonical anchor; the build-agent profile is an implementation sub-option.
  - anchor: profile:jenkins
    id: jenkins
    group: ci-provider
    kind: technical
    providesCapabilities: [default-ci-provider]
  - anchor: profile:localvc
    id: localvc
    kind: technical
    name: Local Version Control

exclude:
  # Configuration-key candidates remain evidence for their owning module rather than duplicate feature nodes.
  - anchor: configkey:artemis.apollon.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.athena.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.atlas.atlasml.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.atlas.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.exam.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.fileupload.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.hyperion.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.iris.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.lecture.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.lti.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.modeling.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.plagiarism.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.sharing.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.text.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.theia.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.tutorialgroup.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.user-management.ldap.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.user-management.passkey.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.user-management.saml2.enabled
    reason: internal-mechanism
  - anchor: configkey:artemis.weaviate.enabled
    reason: internal-mechanism

  # Module-level discoveries that are policy details or backing infrastructure.
  - anchor: module:passkey-admin
    reason: sub-option
    rationale: This is an administrator reauthentication policy within passkey support, not an independent feature.
  - anchor: module:weaviate
    reason: internal-mechanism
    rationale: Weaviate is backing infrastructure for AI capabilities and is not a standalone user-facing feature.

  # Runtime switches that should not become separate model nodes.
  - anchor: toggle:AtlasML
    reason: sub-option
    rationale: The source-level module:atlasml anchor already represents this capability and avoids a duplicate node.
  - anchor: toggle:RateLimit
    reason: operational
    rationale: Rate limiting is an abuse-protection safeguard, not a course or deployment capability choice.
  - anchor: toggle:Science
    reason: experimental
    rationale: Research data collection is experiment consent and policy, not functional model scope.

  # Spring lifecycle and composition profiles are implementation details unless selected above as canonical anchors.
  - anchor: profile:artemis
    reason: internal-mechanism
  - anchor: profile:buildagent
    reason: sub-option
  - anchor: profile:buildagent-test
    reason: internal-mechanism
  - anchor: profile:core
    reason: internal-mechanism
  - anchor: profile:dev
    reason: internal-mechanism
  - anchor: profile:lti
    reason: internal-mechanism
  - anchor: profile:prod
    reason: internal-mechanism
  - anchor: profile:scheduling
    reason: internal-mechanism
  - anchor: profile:test
    reason: internal-mechanism
  - anchor: profile:test-independent-integration
    reason: internal-mechanism

conceptualNodes:
  - id: artemis
    kind: root
    name: Artemis
    description: Root of the Artemis feature model.
  - id: teaching-and-content
    parent: artemis
    kind: group
    name: Teaching and Content
    description: Course-facing teaching, content, and communication capabilities.
  - id: course-workflow
    parent: teaching-and-content
    kind: module
    name: Course Workflow
    description: Core course creation, access, overview, and lifecycle workflows.
  - id: communication
    parent: teaching-and-content
    kind: module
    name: Communication
    description: Course communication, messaging, and notification workflows.
  - id: exercise-system
    parent: artemis
    kind: group
    name: Exercise System
    description: Shared exercise infrastructure and supported exercise types.
  - id: exercise-common
    parent: exercise-system
    kind: module
    name: Common Exercise Infrastructure
    description: Shared creation, participation, submission, and assessment infrastructure for exercises.
  - id: programming
    parent: exercise-system
    kind: module
    name: Programming Exercises
    description: Programming exercise authoring, participation, and automated assessment workflows.
  - id: quiz
    parent: exercise-system
    kind: module
    name: Quiz Exercises
    description: Quiz authoring, participation, and assessment workflows.
  - id: assessment-and-integrity
    parent: artemis
    kind: group
    name: Assessment and Integrity
    description: Exam, assessment-support, and academic-integrity capabilities.
  - id: adaptive-learning-and-ai
    parent: artemis
    kind: group
    name: Adaptive Learning and AI
    description: Adaptive learning, tutoring, feedback, and AI-assisted capabilities.
  - id: platform-integrations
    parent: artemis
    kind: group
    name: Platform Integrations
    description: Authentication, external platform, editor, and sharing integrations.
  - id: database
    parent: artemis
    kind: group
    name: Database
    description: Mutually exclusive database implementation selected for a deployment.
  - id: ci-provider
    parent: artemis
    kind: group
    name: CI Provider
    description: Mutually exclusive continuous-integration implementation selected for programming exercises.
